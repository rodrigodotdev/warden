# cargo-deny — docs/operations.md section 2.7
#
# The project license is not selected yet (docs/open-questions.md item 12).
# `[licenses.private] ignore = true` keeps this check focused on dependencies,
# where the current supply-chain risk resides.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
# Allowed licenses absent from the current graph would otherwise create noise;
# this allowlist is intentionally preventive.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates use `publish = false` and are not checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

deny = [
  { crate = "openssl", reason = "TLS uses rustls (docs/operations.md section 8); OpenSSL adds a native build and C surface" },
  { crate = "openssl-sys", reason = "native-build and FFI crate behind OpenSSL; Warden uses rustls and links no libssl" },
  { crate = "native-tls", reason = "Warden's TLS stack is rustls-ring-webpki" },
  { crate = "async-trait", wrappers = [
    "testcontainers",
    "tonic",
  ], reason = "ADR-0013 requires explicit BoxFuture for Warden ports. testcontainers and tonic use async-trait only inside warden-tracer dev dependencies and never enter production artifacts; this follows the sqlparser/stacker precedent in docs/operations.md section 2.4" },
  { crate = "rust_decimal", reason = "its 96-bit representation loses precision for large NUMERIC values; use bigdecimal (docs/operations.md section 2.2)" },
  { crate = "lazy_static", reason = "use std::sync::LazyLock (Rust 1.80+); mutable global state is forbidden regardless (AGENTS.md, Request path)" },
]
# `stacker`, pulled by sqlparser's default `recursive-protection`, contains `unsafe`.
# Warden's policy covers first-party crates, not transitive dependencies; section 2.4
# documents this reviewed exception.
skip = []
skip-tree = []

# ORDER MATTERS: `[[bans.features]]` is an array of tables. Keys after it belong to
# that table rather than `[bans]`; placing `skip` or `skip-tree` below it makes
# cargo-deny reject unexpected keys. Keep this block last within bans. Verified with
# cargo-deny 0.20.2.
#
# This supply-chain feature ban complements tests/architecture.rs and also detects
# transitive feature unification.
[[bans.features]]
crate = "sqlx"
deny = [
  "any",     # ADR-0005: AnyPool
  "migrate", # ADR-0009: DDL executor inside a read-only gateway
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
