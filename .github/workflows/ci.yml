name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # mise rejects untrusted configuration; the checked-out repository is trusted here.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

# Third-party actions are pinned to commit SHAs, not mutable tags. This is an
# OpenSSF Scorecard requirement and a minimum safeguard for a security product.
# Dependabot keeps the SHAs current.
jobs:
  gate:
    name: fmt · check · lint · test · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not persist GITHUB_TOKEN in .git/config, where later steps or
          # dependency build scripts could read it.
          persist-credentials: false

      - name: Install tools from mise.lock
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install: true
          install_args: taplo aqua:EmbarkStudios/cargo-deny
          cache: true

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate

      # Keep commands explicit: mise provisions auxiliary tools without redefining
      # the documented Cargo gate semantics.
      - run: cargo fmt --all --check
      - run: taplo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace
      - run: cargo deny --workspace check

  docker:
    name: container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docker

      # `--test-threads=4` bounds how many testcontainers this job starts at once.
      # `warden-mysql` is where this was measured (docs/testing.md, "Milestone 7
      # measured a limit on that job's own concurrency"): its container tests grew
      # from 9 to 35 across this milestone, and letting `cargo test` use the
      # runner's full default thread count launched that many MySQL 8.4 containers
      # simultaneously, exhausting Docker and host resources for spurious
      # `PoolTimedOut` failures unrelated to the code under test. The same flag is
      # applied to the other three crates in this step for consistency, since they
      # share this job's Docker daemon and host resources and the identical
      # one-container-per-test pattern — not because any has hit the limit yet. The
      # root package's suite is the one with a second axis: each of its tests also
      # spawns Warden's own binary as a child process for every exchange, so the flag
      # bounds child processes as well as containers there.
      # timeout-minutes: 40 was checked against this milestone's growth, not left
      # untouched by oversight. Locally, `warden-mysql`'s full suite (121 tests, 37
      # of them container tests) finishes in about two minutes wall-clock at
      # `--test-threads=4` with an unthrottled Docker daemon; `warden-tracer` and
      # `warden-postgres` run far fewer container tests each. Even a CI runner many
      # times slower stays comfortably inside 40 minutes, so this budget is
      # unchanged — unlike the coverage job below, which runs the same containers
      # serially under LLVM instrumentation and needed a real increase.
      - name: Integration tests (Testcontainers)
        run: |
          cargo test -p warden-tracer --features docker -- --test-threads=4 --nocapture
          cargo test -p warden-mysql --features docker -- --test-threads=4 --nocapture
          cargo test -p warden-postgres --features docker -- --test-threads=4 --nocapture
          cargo test -p warden --features docker -- --test-threads=4 --nocapture
        timeout-minutes: 40

  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A minimal profile is sufficient because this job only runs `cargo check`.
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv

      # `rust-version = "1.94"` is a compatibility promise. This job catches the
      # first accidental use of a newer language or library feature.
      - run: cargo +1.94.0 check --workspace --all-targets

  commits:
    name: commit convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install: true
          install_args: aqua:crate-ci/committed
          cache: true

      - run: committed ${{ github.event.pull_request.base.sha }}..HEAD

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install: true
          install_args: cargo:cargo-llvm-cov
          cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage

      # `--all-features` enables each adapter's `docker` feature, so the container
      # tests contribute. Without it the connection code that only runs against a
      # server counts as uncovered and the 95% floor fails for a reason that is not a
      # missing test. GitHub-hosted runners provide a Docker daemon, which the
      # `docker` job above already relies on. LLVM instrumentation makes concurrent
      # PostgreSQL container startup intermittently exceed the 3s pool acquire limit;
      # serialize only this coverage collection. The dedicated Docker gate above runs
      # the same suite at `--test-threads=4` instead of this job's `--test-threads=1`,
      # so it validates normal, bounded-concurrency test mode separately.
      #
      # `warden-mysql` alone starts 35 MySQL 8.4 containers across this job's serial,
      # LLVM-instrumented run, up from 9 before Milestone 7. A full local
      # `cargo llvm-cov --workspace --all-features -- --test-threads=1` run on
      # comparable hardware finished in roughly 45 minutes; a hosted runner is
      # typically slower, so the timeout below is set well above that, not at it, to
      # avoid trading a real regression for a flaky-timeout regression.
      - run: cargo llvm-cov --workspace --all-features --no-report -- --test-threads=1
        timeout-minutes: 70
      - run: cargo llvm-cov report --workspace --html --output-dir coverage
      - run: cargo llvm-cov report --workspace --summary-only --fail-under-lines 95
