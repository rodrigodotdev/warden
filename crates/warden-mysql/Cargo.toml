[package]
name = "warden-mysql"
version = "0.1.0"
description = "MySQL adapter for analysis, execution, inspection, explain, normalization, and connections"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Enables tests that require an accessible Docker daemon. Without it,
# `cargo test --workspace` — the CI gate — starts no container.
docker = []

[dependencies]
warden-core = { workspace = true }
warden-policy = { workspace = true }
warden-ports = { workspace = true }
# ADR-0004/0005: concrete `MySqlPool` values, with `any` and `migrate` disabled
# workspace-wide so `AnyPool` and the DDL migration executor are compile errors.
sqlx = { workspace = true }
# `time` only: this crate needs `timeout_at` for connection health checks. It starts
# no runtime; the binary does.
tokio = { workspace = true, features = ["time"] }
sqlparser = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Depend only on `testcontainers-modules`, which re-exports `testcontainers`. A
# direct dependency would select an incompatible version and compile two copies
# whose types do not unify.
testcontainers-modules = { workspace = true }
syn = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
