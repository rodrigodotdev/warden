[package]
name = "warden-mysql"
version = "0.1.0"
description = "MySQL adapter for analysis, execution, inspection, explain, normalization, and connections"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Enables tests that require an accessible Docker daemon. Without it,
# `cargo test --workspace` — the CI gate — starts no container.
docker = []

[dependencies]
warden-core = { workspace = true }
warden-policy = { workspace = true }
warden-ports = { workspace = true }
# ADR-0004/0005: concrete `MySqlPool` values. `any` and `migrate` are disabled
# workspace-wide, so `sqlx::AnyPool` and `sqlx::migrate!` are compile errors here;
# ADR-0004 records that `sqlx-core` compiles both modules anyway, and
# `tests/architecture.rs` pins that limitation.
sqlx = { workspace = true }
# `time` only: this crate needs `timeout_at` for connection health checks. It starts
# no runtime; the binary does.
tokio = { workspace = true, features = ["time"] }
# `CancellationToken` lives in the ungated `tokio_util::sync` module, so the
# workspace's `default-features = false` is enough (verified against tokio-util
# 0.7.19), the same as `warden-ports`.
tokio-util = { workspace = true }
# `Query::fetch` returns a `BoxStream` and sqlx re-exports no way to advance one.
# `TryStreamExt::try_next` is how a result is consumed one row at a time, which
# docs/operations.md section 6.6 requires.
futures-util = { workspace = true }
sqlparser = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# docs/data-model.md section 8.1 rule 3: binary values leave as base64.
base64 = { workspace = true }
# A JSON column becomes `ResultValue::Json`.
serde_json = { workspace = true }
# MySQL sends DATE and DATETIME as packed binary in the prepared-statement
# protocol, so they cannot be read as text. These are the types sqlx's `time`
# feature decodes them into; no formatting feature is used, because the three
# formatters below are `write!` calls producing MySQL's own canonical text.
time = { workspace = true }

[dev-dependencies]
# Depend only on `testcontainers-modules`, which re-exports `testcontainers`. A
# direct dependency would select an incompatible version and compile two copies
# whose types do not unify.
testcontainers-modules = { workspace = true }
syn = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
