[package]
name = "warden-postgres"
version = "0.1.0"
description = "PostgreSQL adapter for analysis, execution, inspection, explain, normalization, and connections"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Enables tests that require an accessible Docker daemon. Without it,
# `cargo test --workspace` — the CI gate — starts no container.
docker = []

[dependencies]
# docs/data-model.md section 8.1 rule 3: binary values leave as base64.
base64 = { workspace = true }
# A `json` or `jsonb` column becomes `ResultValue::Json`.
serde_json = { workspace = true }
# PostgreSQL sends DATE, TIME, TIMESTAMP and TIMESTAMPTZ as packed binary in the
# extended protocol, so they cannot be read as text. `normalize.rs` decodes the
# underlying integer itself for the three that can overflow `time`'s calendar and
# uses `time`'s own types for the arithmetic and the rendering; the three
# formatters are plain `write!` calls, so no formatting feature is used here.
time = { workspace = true }
warden-core = { workspace = true }
warden-policy = { workspace = true }
warden-ports = { workspace = true }
# ADR-0004/0005: concrete `PgPool` values. `any` and `migrate` are disabled
# workspace-wide, so `sqlx::AnyPool` and `sqlx::migrate!` are compile errors here;
# ADR-0004 records that `sqlx-core` compiles both modules anyway, and
# `tests/architecture.rs` pins that limitation.
sqlx = { workspace = true }
# `time` powers deadlines and `macros` enables the executor's `tokio::select!`.
# This crate starts no runtime; the binary does.
tokio = { workspace = true, features = ["macros", "time"] }
# `CancellationToken` lives in the ungated `tokio_util::sync` module, so the
# workspace's `default-features = false` is enough, the same as `warden-ports`.
tokio-util = { workspace = true }
# `Query::fetch` returns a `BoxStream` and sqlx re-exports no way to advance one.
# `TryStreamExt::try_next` consumes results one row at a time.
futures-util = { workspace = true }
sqlparser = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Depend only on `testcontainers-modules`, which re-exports `testcontainers`.
testcontainers-modules = { workspace = true }
syn = { workspace = true }
# Test-only runtime support for async configuration-validation and container tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
