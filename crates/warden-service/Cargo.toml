[package]
name = "warden-service"
version = "0.1.0"
description = "Application services for queries, schemas, explain, registry, limits, and redaction"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
warden-core = { workspace = true }
warden-policy = { workspace = true }
warden-ports = { workspace = true }
# `AuditAttempt::timestamp` is the concrete `time::OffsetDateTime` the port exposes.
time = { workspace = true }
thiserror = { workspace = true }
# `time` for `tokio::time::{timeout, Instant}`: the audit sink takes no deadline, so
# the caller bounds its writes (`crates/warden-ports/src/audit.rs`), and every port
# that runs SQL takes a `tokio::time::Instant` deadline (ADR-0024). `rt` is for
# `Handle::try_current` in the audit drop guard, which detaches one write during
# unwinding; this crate still starts no runtime.
tokio = { workspace = true, features = ["time", "rt"] }
# `CancellationToken` lives in the ungated `tokio_util::sync` module.
tokio-util = { workspace = true }
# The redaction matcher walks `QueryPlan::plan`, which is a `serde_json::Value`.
serde_json = { workspace = true }
# The audit outcome write fails open with an alarm (ADR-0022), and an alarm needs a
# logger. Fields follow `docs/operations.md` section 10.2; `raw_sql` is not one.
tracing = { workspace = true }

[dev-dependencies]
# Shared fixtures and the one callsite-interest primitive (ADR-0049). Dev-only: it
# appears in no normal dependency edge, which `tests/architecture.rs` proves.
warden-testing = { workspace = true }
# `test-util` provides `#[tokio::test(start_paused = true)]`, which makes every
# deadline and queue-wait test deterministic and instant.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# Mechanical guards inspect Rust syntax rather than text, so comments, literals,
# formatting, UFCS, and nested modules cannot bypass or falsely trigger them.
syn = { workspace = true }
# `syn::Macro` deliberately leaves its body as a token stream. The guards walk
# those token trees to cover macro-generated gated calls and startup error impls.
proc-macro2 = { workspace = true }
