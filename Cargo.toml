[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
authors = ["Rodrigo <rodrigodotdev@proton.me>"]
repository = "https://github.com/rodrigodotdev/warden"
publish = false

[workspace.dependencies]
# Internal crates
warden-core = { path = "crates/warden-core" }
warden-policy = { path = "crates/warden-policy" }
warden-ports = { path = "crates/warden-ports" }
warden-mysql = { path = "crates/warden-mysql" }
warden-postgres = { path = "crates/warden-postgres" }
warden-service = { path = "crates/warden-service" }
warden-mcp = { path = "crates/warden-mcp" }
warden-config = { path = "crates/warden-config" }

# Runtime
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }

# Database — docs/operations.md section 2.2.
# SQLx 0.9 defaults enable `any`/`AnyPool` and the DDL migration executor,
# contradicting ADR-0005 and the read-only design. Disabling `any` turns the
# AnyPool prohibition into a compile-time rule. `bigdecimal` preserves large
# NUMERIC values that the 96-bit `rust_decimal` would truncate.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "mysql",
  "postgres",
  "json",
  "time",
  "uuid",
  "bigdecimal",
] }

# Row streaming — docs/operations.md section 6.6 forbids buffering a whole result
# before truncating it, `Query::fetch` returns a `BoxStream`, and sqlx re-exports no
# way to advance one. `alloc` is all `TryStreamExt::try_next` needs; `sqlx-core`
# already depends on this crate with a superset of these features.
futures-util = { version = "0.3", default-features = false, features = [
  "alloc",
] }

# MCP — docs/operations.md section 2.3.
# rmcp 3.1.3 defaults include `base64`, but it gates only image/blob helpers in
# `model/prompt.rs`; Warden exposes tools, not MCP prompts. `server` already implies
# `schemars` and `transport-async-rw`; listing `schemars` is redundant but explicit.
#
# `transport-streamable-http-server` is deferred to Milestone 14. So is `auth`,
# whose manifest pulls in `dep:async-trait`, banned by `deny.toml` under ADR-0013
# except through the `testcontainers`/`tonic` wrappers. Enabling `auth` requires an
# explicit ADR-0013 decision, not merely another feature name.
rmcp = { version = "3.1.3", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-io",
] }

# Parser — docs/operations.md section 2.4. Keep the default `recursive-protection`
# feature to prevent stack overflow on deeply nested SQL. `visitor` derives
# Visit/VisitMut on every AST node, so an adapter's traversal is exhaustive by
# construction and a bypass cannot hide in a variant nobody remembered to match
# (docs/security.md section 7.1).
sqlparser = { version = "0.62.0", features = ["visitor"] }

# DSN parsing — ADR-0031. `warden-core` validates a connection string itself rather
# than letting a driver's URL parser decide what a DSN may contain; these are the
# same two crates `sqlx` parses URLs with, so both see one string the same way.
url = "2.5"
percent-encoding = "2.3"

# Fingerprints — docs/security.md section 11.4 requires `v1:<sha256-hex>`, and std
# has no SHA-256. Used behind one function per adapter; hex comes from `{:02x}`
# rather than another crate.
sha2 = "0.11"
# Mechanical guards parse the adapters' own source: `visit` walks every call site
# so a comment or a string literal can neither satisfy nor trip a check.
syn = { version = "3", features = ["full", "visit"] }
# `syn::Macro` deliberately leaves a macro body as a token stream, so a guard that must
# see inside one walks those token trees itself.
proc-macro2 = "1"

# Serialization and errors
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Secrets and types
secrecy = "0.10"
# Dates and times. `formatting`/`parsing` serve the config and DSN layers;
# `macros` gives `warden-postgres` a `const` PostgreSQL epoch, which is what lets
# it convert a wire integer into a date with checked arithmetic instead of handing
# the value to a `sqlx` decoder that panics on `infinity` (SPEC section 6,
# invariant 31). `time-macros` is already in `Cargo.lock` through `sqlx`, so the
# dependency graph does not grow.
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1.24", features = ["v4"] }
bigdecimal = "0.4"
base64 = "0.23"

# Tests. Depend only on `testcontainers-modules`, which re-exports `testcontainers`.
# A direct dependency would select incompatible 0.28 and compile two copies whose
# types do not unify.
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
# An auditable security gateway documents its public surface. CI denies warnings,
# so this makes an undocumented public item a build failure — including in test
# files, which need a `//!` header.
missing_docs = "warn"

[workspace.lints.clippy]
# A fallible public function documents what makes it fail. The prose usually said so
# already; this makes the `# Errors` heading the mechanical rule rather than a habit,
# so rustdoc renders it and CI — which denies warnings — enforces it.
missing_errors_doc = "warn"
print_stdout = "deny"
print_stderr = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"

[package]
name = "warden"
version = "0.1.0"
description = "Secure, read-only, auditable query gateway for AI agents"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The composition root is the one place that names every layer at once
# (`docs/architecture.md` section 2). Nothing else in the workspace depends on both
# an adapter and the MCP crate, which is what keeps the dependency direction real.
warden-config = { workspace = true }
warden-core = { workspace = true }
warden-mcp = { workspace = true }
warden-mysql = { workspace = true }
warden-policy = { workspace = true }
warden-ports = { workspace = true }
warden-postgres = { workspace = true }
warden-service = { workspace = true }
# `anyhow` is allowed in main, startup composition, and CLI diagnostics, and nowhere
# else (AGENTS.md).
anyhow = { workspace = true }
# The one runtime (ADR-0003). `signal` is what makes graceful shutdown a real signal
# handler rather than a comment (`docs/architecture.md` section 13).
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# stderr only: stdout carries MCP (`docs/mcp.md` section 5.1).
tracing-subscriber = { workspace = true }

[features]
default = []
# Enables the container-backed MCP end-to-end tests. Without it,
# `cargo test --workspace` — the CI gate — starts no container.
docker = []

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
# The end-to-end tests drive Warden's own binary as a subprocess against real
# containers: `process` and `io-util` speak to its stdio, `time` bounds every wait.
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "time",
] }
# `AuditAttempt::timestamp` is the concrete `time::OffsetDateTime` the port exposes,
# so the audit sink's own tests have to name it. Production code here never does.
time = { workspace = true }
# `tests/mcp_database.rs` provisions the fixture and the least-privileged role each
# container test runs as, and then sends a write to that role with every Warden layer
# removed — the second half of `AGENTS.md`'s rule that an integration test proves the
# *database role* refuses a write, not only that policy does. A dev-dependency only:
# `cargo metadata`'s normal-dependency graph, which `tests/architecture.rs` walks, is
# unchanged, and the composition root already reaches this exact version through both
# adapters, so nothing new is compiled.
sqlx = { workspace = true }

# Per-task panic containment depends on unwinding; see docs/security.md section 14.
[profile.release]
panic = "unwind"
